<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Laps – טיימר סיבובים</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161922;
      --surface2: #1e2230;
      --border: #2a2f40;
      --accent-work: #4f8ef7;
      --accent-break: #34d399;
      --accent-warn: #f59e0b;
      --accent-danger: #ef4444;
      --text: #e8ecf4;
      --text-muted: #7a85a3;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--accent-work), var(--accent-break));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    /* ── Rounds config ────────────────────────────── */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }

    .config-card h2 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .rounds-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .round-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }

    .round-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 60px;
    }

    .round-name {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .round-name::placeholder { color: var(--text-muted); }

    .time-input-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .time-input-wrap input {
      width: 52px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 4px 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .time-input-wrap input:focus { border-color: var(--accent-work); }
    .time-input-wrap span { color: var(--text-muted); font-size: 0.85rem; }

    .btn-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
    }
    .btn-remove:hover { color: var(--accent-danger); background: rgba(239,68,68,.12); }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 14px;
      width: 100%;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-add:hover { border-color: var(--accent-work); color: var(--accent-work); }

    .repeat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .repeat-row label { font-size: 0.9rem; color: var(--text-muted); }
    .repeat-row input {
      width: 70px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 4px 6px;
      outline: none;
    }
    .repeat-row input:focus { border-color: var(--accent-work); }

    /* ── Timer display ────────────────────────────── */
    .timer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .phase-badge {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(79,142,247,.15);
      color: var(--accent-work);
      transition: background 0.4s, color 0.4s;
    }
    .phase-badge.break {
      background: rgba(52,211,153,.15);
      color: var(--accent-break);
    }

    .round-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: -16px;
    }

    /* Ring progress */
    .ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 10; }
    .ring-progress {
      fill: none;
      stroke: var(--accent-work);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.9s linear, stroke 0.4s;
    }

    .ring-time {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .time-display {
      font-size: clamp(2.8rem, 10vw, 3.8rem);
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
      transition: color 0.3s;
    }

    .time-display.warn { color: var(--accent-warn); }
    .time-display.danger { color: var(--accent-danger); }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 28px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent-work);
      color: #fff;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: rgba(239,68,68,.15);
      color: var(--accent-danger);
      border: 1px solid rgba(239,68,68,.25);
    }

    /* Progress bar (phases) */
    .phases-bar {
      display: flex;
      gap: 4px;
      width: 100%;
    }
    .phase-seg {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--surface2);
      transition: background 0.4s;
      position: relative;
      overflow: hidden;
    }
    .phase-seg.active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-work);
      animation: fillSeg linear forwards;
      animation-duration: var(--seg-dur, 5s);
    }
    .phase-seg.done { background: rgba(79,142,247,.35); }
    .phase-seg.break.active::after { background: var(--accent-break); }
    .phase-seg.break.done { background: rgba(52,211,153,.35); }

    @keyframes fillSeg {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* Status */
    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      height: 18px;
    }

    /* Pulse animation on beep */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
      70%  { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .ring-wrap.beep { animation: pulse 0.4s ease-out; }

    /* Finished banner */
    .finished-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(52,211,153,.12);
      border: 1px solid rgba(52,211,153,.3);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95rem;
      color: var(--accent-break);
      font-weight: 600;
      width: 100%;
      max-width: 560px;
      justify-content: center;
    }
    .finished-banner.show { display: flex; }
  </style>
</head>
<body>

<h1>⏱ Time Laps</h1>
<p class="subtitle">הגדר סיבובי זמן עם צפצופי ספירה לאחור</p>

<!-- Config -->
<div class="config-card">
  <h2>הגדרת סיבובים</h2>
  <div class="rounds-list" id="roundsList"></div>
  <button class="btn-add" onclick="addRound()">＋ הוסף שלב</button>
  <div class="repeat-row">
    <label for="repeatCount">חזור על הסט:</label>
    <input id="repeatCount" type="number" min="1" max="99" value="1" />
    <span style="font-size:.85rem;color:var(--text-muted)">פעמים</span>
  </div>
</div>

<!-- Timer -->
<div class="timer-card">
  <div class="phase-badge" id="phaseBadge">מוכן</div>
  <div class="round-info" id="roundInfo">סיבוב – / –</div>

  <div class="ring-wrap" id="ringWrap">
    <svg viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100" />
      <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"
        stroke-dasharray="628.3"
        stroke-dashoffset="0" />
    </svg>
    <div class="ring-time">
      <div class="time-display" id="timeDisplay">00:00</div>
    </div>
  </div>

  <div class="phases-bar" id="phasesBar"></div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart" onclick="startTimer()">התחל</button>
    <button class="btn btn-secondary" id="btnPause" onclick="pauseTimer()" disabled>השהה</button>
    <button class="btn btn-danger" id="btnReset" onclick="resetTimer()" disabled>אפס</button>
  </div>

  <div class="status-text" id="statusText"></div>
</div>

<div class="finished-banner" id="finishedBanner">
  ✅ כל הסיבובים הושלמו!
</div>

<script>
/* ─────────────────────────────────────────────
   Default rounds
───────────────────────────────────────────── */
let roundDefs = [
  { name: 'עבודה', mins: 5, secs: 0 },
  { name: 'הפסקה', mins: 1, secs: 0 },
];

function addRound(name = 'שלב', mins = 1, secs = 0) {
  roundDefs.push({ name, mins, secs });
  renderConfig();
}

function removeRound(i) {
  if (roundDefs.length <= 1) return;
  roundDefs.splice(i, 1);
  renderConfig();
}

function renderConfig() {
  const list = document.getElementById('roundsList');
  list.innerHTML = '';
  roundDefs.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'round-row';
    row.innerHTML = `
      <span class="round-label">שלב ${i + 1}</span>
      <input class="round-name" type="text" placeholder="שם" value="${r.name}"
        oninput="roundDefs[${i}].name=this.value" />
      <div class="time-input-wrap">
        <input type="number" min="0" max="99" value="${r.mins}"
          oninput="roundDefs[${i}].mins=+this.value" />
        <span>דק׳</span>
        <input type="number" min="0" max="59" value="${String(r.secs).padStart(2,'0')}"
          oninput="roundDefs[${i}].secs=+this.value" />
        <span>שנ׳</span>
      </div>
      <button class="btn-remove" onclick="removeRound(${i})" title="הסר">✕</button>
    `;
    list.appendChild(row);
  });
}

renderConfig();

/* ─────────────────────────────────────────────
   Audio (Web Audio API)
───────────────────────────────────────────── */
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq = 880, durationMs = 120, volume = 0.5) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationMs / 1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + durationMs / 1000);
  } catch (e) { console.warn('audio error', e); }
}

function shortBeep() { beep(880, 130, 0.55); }
function longBeep()  { beep(660, 600, 0.65); }

/* ─────────────────────────────────────────────
   Timer state
───────────────────────────────────────────── */
let sequence = [];   // flat list of {name, totalSecs, isBreak}
let seqIdx = 0;
let remaining = 0;
let totalForPhase = 0;
let repeatCount = 1;
let currentRepeat = 0;
let ticker = null;
let running = false;
let beeped3 = false, beeped2 = false, beeped1 = false;

function buildSequence() {
  repeatCount = Math.max(1, parseInt(document.getElementById('repeatCount').value) || 1);
  sequence = [];
  for (let r = 0; r < repeatCount; r++) {
    roundDefs.forEach((rd, i) => {
      const secs = (rd.mins || 0) * 60 + (rd.secs || 0);
      if (secs > 0) {
        sequence.push({
          name: rd.name || `שלב ${i + 1}`,
          totalSecs: secs,
          isBreak: i % 2 === 1,
          repeatNum: r + 1,
        });
      }
    });
  }
}

function startTimer() {
  // Unlock audio context on first user gesture
  getAudioCtx();

  if (sequence.length === 0 || seqIdx >= sequence.length) {
    buildSequence();
    seqIdx = 0;
  }

  if (!running) {
    if (remaining === 0) {
      loadPhase(seqIdx);
    }
    running = true;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnPause').disabled = false;
    document.getElementById('btnReset').disabled = false;
    document.getElementById('finishedBanner').classList.remove('show');
    tick();
    ticker = setInterval(tick, 1000);
  }
}

function pauseTimer() {
  if (running) {
    running = false;
    clearInterval(ticker);
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnPause').disabled = true;
    document.getElementById('statusText').textContent = '⏸ מושהה';
  }
}

function resetTimer() {
  clearInterval(ticker);
  running = false;
  seqIdx = 0;
  remaining = 0;
  sequence = [];
  beeped3 = beeped2 = beeped1 = false;
  updateDisplay(0, 0);
  document.getElementById('phaseBadge').textContent = 'מוכן';
  document.getElementById('phaseBadge').className = 'phase-badge';
  document.getElementById('roundInfo').textContent = 'סיבוב – / –';
  document.getElementById('ringProgress').style.strokeDashoffset = '0';
  document.getElementById('ringProgress').style.stroke = 'var(--accent-work)';
  document.getElementById('timeDisplay').className = 'time-display';
  document.getElementById('statusText').textContent = '';
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnReset').disabled = true;
  document.getElementById('finishedBanner').classList.remove('show');
  renderPhasesBar([]);
}

function loadPhase(idx) {
  const ph = sequence[idx];
  totalForPhase = ph.totalSecs;
  remaining = ph.totalSecs;
  beeped3 = beeped2 = beeped1 = false;

  const badge = document.getElementById('phaseBadge');
  badge.textContent = ph.name;
  badge.className = 'phase-badge' + (ph.isBreak ? ' break' : '');

  document.getElementById('ringProgress').style.stroke =
    ph.isBreak ? 'var(--accent-break)' : 'var(--accent-work)';

  document.getElementById('roundInfo').textContent =
    `סיבוב ${ph.repeatNum} / ${repeatCount}  •  שלב ${(idx % roundDefs.length) + 1} מתוך ${roundDefs.length}`;

  renderPhasesBar(sequence);
}

function tick() {
  if (remaining <= 0) {
    nextPhase();
    return;
  }

  // Beep logic
  if (remaining === 3 && !beeped3) { beeped3 = true; shortBeep(); pulseRing(); }
  if (remaining === 2 && !beeped2) { beeped2 = true; shortBeep(); pulseRing(); }
  if (remaining === 1 && !beeped1) { beeped1 = true; longBeep();  pulseRing(); }

  updateDisplay(remaining, totalForPhase);
  remaining--;
}

function nextPhase() {
  seqIdx++;
  if (seqIdx >= sequence.length) {
    // All done
    clearInterval(ticker);
    running = false;
    updateDisplay(0, totalForPhase);
    document.getElementById('phaseBadge').textContent = 'הסתיים!';
    document.getElementById('statusText').textContent = '';
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnPause').disabled = true;
    document.getElementById('finishedBanner').classList.add('show');
    longBeep();
    setTimeout(() => { longBeep(); }, 700);
    return;
  }
  loadPhase(seqIdx);
  beeped3 = beeped2 = beeped1 = false;
}

/* ─────────────────────────────────────────────
   Display helpers
───────────────────────────────────────────── */
function updateDisplay(secs, total) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  const text = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.getElementById('timeDisplay').textContent = text;

  // Color warning
  const disp = document.getElementById('timeDisplay');
  if (secs <= 1) disp.className = 'time-display danger';
  else if (secs <= 3) disp.className = 'time-display warn';
  else disp.className = 'time-display';

  // Ring progress (circumference = 2π×100 ≈ 628.3)
  const CIRC = 628.3;
  const ratio = total > 0 ? secs / total : 0;
  document.getElementById('ringProgress').style.strokeDashoffset = CIRC * (1 - ratio);

  // status text
  if (secs <= 3 && secs > 0 && running) {
    document.getElementById('statusText').textContent = `⚠️ ${secs} שניות נותרו!`;
  } else if (running) {
    document.getElementById('statusText').textContent = '';
  }
}

function pulseRing() {
  const ring = document.getElementById('ringWrap');
  ring.classList.remove('beep');
  void ring.offsetWidth; // reflow
  ring.classList.add('beep');
}

function renderPhasesBar(seq) {
  const bar = document.getElementById('phasesBar');
  bar.innerHTML = '';
  seq.forEach((ph, i) => {
    const seg = document.createElement('div');
    seg.className = 'phase-seg' +
      (ph.isBreak ? ' break' : '') +
      (i < seqIdx ? ' done' : '') +
      (i === seqIdx ? ' active' : '');
    if (i === seqIdx) {
      seg.style.setProperty('--seg-dur', ph.totalSecs + 's');
    }
    seg.title = ph.name;
    bar.appendChild(seg);
  });
}
</script>
</body>
</html>
