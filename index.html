<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Time Laps</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0d0f14;
      --surface: #161922;
      --surface2: #1e2230;
      --border: #2a2f40;
      --accent-work: #4f8ef7;
      --accent-break: #34d399;
      --accent-warn: #f59e0b;
      --accent-danger: #ef4444;
      --text: #e8ecf4;
      --text-muted: #7a85a3;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(14px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(28px + var(--safe-bottom))
        calc(16px + var(--safe-left));
      -webkit-text-size-adjust: 100%;
    }

    h1 {
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
      background: linear-gradient(135deg, var(--accent-work), var(--accent-break));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: clamp(0.78rem, 3.2vw, 0.88rem);
      margin-bottom: 16px;
      text-align: center;
    }

    /* Wake lock pill */
    .wakelock-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px 10px;
      margin-bottom: 14px;
      transition: color 0.3s, border-color 0.3s;
    }
    .wakelock-pill.active {
      color: var(--accent-break);
      border-color: rgba(52,211,153,.35);
    }
    .wakelock-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .wakelock-pill.active .wakelock-dot { background: var(--accent-break); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
    }

    .config-card {
      padding: 18px 16px;
      margin-bottom: 14px;
    }

    .config-card h2 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Round rows */
    .rounds-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .round-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 10px;
      row-gap: 8px;
      align-items: center;
    }

    .round-label {
      font-size: 0.73rem;
      color: var(--text-muted);
      white-space: nowrap;
      grid-row: 1; grid-column: 1;
    }

    .round-name {
      grid-row: 1; grid-column: 2;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }
    .round-name::placeholder { color: var(--text-muted); }

    .btn-remove {
      grid-row: 1; grid-column: 3;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      border-radius: 8px;
      min-width: 36px; min-height: 36px;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
      transition: color 0.2s, background 0.2s;
    }
    .btn-remove:hover,
    .btn-remove:active { color: var(--accent-danger); background: rgba(239,68,68,.12); }

    .time-input-wrap {
      grid-row: 2; grid-column: 1 / 4;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }

    .time-input-wrap input {
      width: 58px; height: 42px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 4px 6px;
      outline: none;
      touch-action: manipulation;
      transition: border-color 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    .time-input-wrap input:focus { border-color: var(--accent-work); }
    .time-input-wrap span { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }

    .btn-add {
      display: flex; align-items: center; gap: 6px;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.9rem; font-family: inherit;
      cursor: pointer;
      padding: 12px 14px; width: 100%;
      justify-content: center; min-height: 46px;
      touch-action: manipulation;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-add:hover, .btn-add:active { border-color: var(--accent-work); color: var(--accent-work); }

    .repeat-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 12px; flex-wrap: wrap;
    }
    .repeat-row label { font-size: 0.88rem; color: var(--text-muted); }
    .repeat-row input {
      width: 72px; height: 42px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px; font-family: 'Courier New', monospace;
      text-align: center; padding: 4px 6px; outline: none;
      touch-action: manipulation;
      -webkit-appearance: none; appearance: none;
    }
    .repeat-row input:focus { border-color: var(--accent-work); }
    .repeat-row span { font-size: 0.85rem; color: var(--text-muted); }

    /* Timer card */
    .timer-card {
      padding: 22px 16px 18px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
    }

    .phase-badge {
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase;
      padding: 5px 16px; border-radius: 99px;
      background: rgba(79,142,247,.15);
      color: var(--accent-work);
      transition: background 0.3s, color 0.3s;
    }
    .phase-badge.break { background: rgba(52,211,153,.15); color: var(--accent-break); }

    .round-info {
      font-size: 0.8rem; color: var(--text-muted);
      margin-top: -10px; text-align: center;
    }

    /* Ring */
    .ring-wrap {
      position: relative;
      width: min(62vw, 240px);
      height: min(62vw, 240px);
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
      width: 100%; height: 100%;
    }

    .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 10; }
    .ring-progress {
      fill: none;
      stroke: var(--accent-work);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke 0.4s;
      /* No CSS transition on dashoffset — JS updates it directly for accuracy */
    }

    .ring-time {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .time-display {
      font-size: clamp(2.4rem, 12vw, 3.6rem);
      font-family: 'Courier New', monospace;
      font-weight: 700; letter-spacing: 2px; line-height: 1;
      transition: color 0.3s;
    }
    .time-display.warn   { color: var(--accent-warn); }
    .time-display.danger { color: var(--accent-danger); }

    /* Controls */
    .controls { display: flex; gap: 10px; width: 100%; }

    .btn {
      flex: 1; border: none; border-radius: 12px;
      font-family: inherit;
      font-size: clamp(0.9rem, 4vw, 1rem);
      font-weight: 700; cursor: pointer;
      padding: 14px 10px; min-height: 52px;
      touch-action: manipulation;
      transition: opacity 0.2s, transform 0.1s;
      -webkit-appearance: none;
    }
    .btn:active  { transform: scale(0.95); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-primary   { background: var(--accent-work); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger    { background: rgba(239,68,68,.15); color: var(--accent-danger); border: 1px solid rgba(239,68,68,.25); }

    /* Phases bar */
    .phases-bar { display: flex; gap: 4px; width: 100%; }
    .phase-seg {
      flex: 1; height: 6px; border-radius: 99px;
      background: var(--surface2);
      transition: background 0.3s;
    }
    .phase-seg.active { background: var(--accent-work); }
    .phase-seg.done   { background: rgba(79,142,247,.35); }
    .phase-seg.break.active { background: var(--accent-break); }
    .phase-seg.break.done   { background: rgba(52,211,153,.35); }

    .status-text {
      font-size: 0.85rem; color: var(--text-muted);
      min-height: 20px; text-align: center;
    }

    .finished-banner {
      display: none; align-items: center; gap: 10px;
      background: rgba(52,211,153,.12);
      border: 1px solid rgba(52,211,153,.3);
      border-radius: 12px; padding: 14px 20px;
      font-size: 0.95rem; color: var(--accent-break); font-weight: 600;
      width: 100%; max-width: 540px;
      justify-content: center; margin-top: 12px;
    }
    .finished-banner.show { display: flex; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.55); }
      70%  { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .ring-wrap.beep { animation: pulse 0.4s ease-out; border-radius: 50%; }

    @media (max-height: 500px) and (orientation: landscape) {
      body { padding-top: 8px; padding-bottom: 8px; }
      h1 { font-size: 1.3rem; }
      .subtitle, .wakelock-pill { display: none; }
      .ring-wrap { width: min(34vw, 150px); height: min(34vw, 150px); }
      .timer-card { flex-direction: row; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
      .phase-badge, .round-info, .phases-bar, .status-text, .controls { width: 100%; }
      .controls { flex-direction: column; }
      .btn { min-height: 44px; padding: 10px 14px; }
    }
  </style>
</head>
<body>

<h1>⏱ Time Laps</h1>
<p class="subtitle">הגדר סיבובי זמן עם צפצופי ספירה לאחור</p>

<div class="wakelock-pill" id="wakelockPill">
  <span class="wakelock-dot"></span>
  <span id="wakelockLabel">מסך חופשי</span>
</div>

<!-- Config -->
<div class="card config-card">
  <h2>הגדרת סיבובים</h2>
  <div class="rounds-list" id="roundsList"></div>
  <button class="btn-add" onclick="addRound()">＋ הוסף שלב</button>
  <div class="repeat-row">
    <label for="repeatCount">חזור על הסט:</label>
    <input id="repeatCount" type="number" inputmode="numeric" min="1" max="99" value="1" />
    <span>פעמים</span>
  </div>
</div>

<!-- Timer -->
<div class="card timer-card">
  <div class="phase-badge" id="phaseBadge">מוכן</div>
  <div class="round-info" id="roundInfo">סיבוב – / –</div>

  <div class="ring-wrap" id="ringWrap">
    <svg viewBox="0 0 220 220">
      <circle class="ring-bg"       cx="110" cy="110" r="100" />
      <circle class="ring-progress" cx="110" cy="110" r="100"
        id="ringProgress" stroke-dasharray="628.3" stroke-dashoffset="0" />
    </svg>
    <div class="ring-time">
      <div class="time-display" id="timeDisplay">00:00</div>
    </div>
  </div>

  <div class="phases-bar" id="phasesBar"></div>

  <div class="controls">
    <button class="btn btn-primary"   id="btnStart" onclick="startTimer()">התחל</button>
    <button class="btn btn-secondary" id="btnPause" onclick="pauseTimer()" disabled>השהה</button>
    <button class="btn btn-danger"    id="btnReset" onclick="resetTimer()" disabled>אפס</button>
  </div>

  <div class="status-text" id="statusText"></div>
</div>

<div class="finished-banner" id="finishedBanner">✅ כל הסיבובים הושלמו!</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
let roundDefs = [
  { name: 'עבודה', mins: 5, secs: 0 },
  { name: 'הפסקה', mins: 1, secs: 0 },
];

function addRound(name = 'שלב', mins = 1, secs = 0) {
  roundDefs.push({ name, mins, secs });
  renderConfig();
}

function removeRound(i) {
  if (roundDefs.length <= 1) return;
  roundDefs.splice(i, 1);
  renderConfig();
}

function renderConfig() {
  const list = document.getElementById('roundsList');
  list.innerHTML = '';
  roundDefs.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'round-row';
    row.innerHTML = `
      <span class="round-label">שלב ${i + 1}</span>
      <input class="round-name" type="text" placeholder="שם השלב" value="${r.name}"
        oninput="roundDefs[${i}].name=this.value" />
      <button class="btn-remove" onclick="removeRound(${i})" title="הסר שלב">✕</button>
      <div class="time-input-wrap">
        <input type="number" inputmode="numeric" min="0" max="99" value="${r.mins}"
          oninput="roundDefs[${i}].mins=+this.value||0" />
        <span>דקות</span>
        <input type="number" inputmode="numeric" min="0" max="59"
          value="${String(r.secs).padStart(2,'0')}"
          oninput="roundDefs[${i}].secs=+this.value||0" />
        <span>שניות</span>
      </div>
    `;
    list.appendChild(row);
  });
}
renderConfig();

/* ═══════════════════════════════════════════
   WAKE LOCK
═══════════════════════════════════════════ */
let wakeLock = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', onWakeLockReleased);
    setWakeLockUI(true);
  } catch (e) { /* not available */ }
}

function onWakeLockReleased() {
  wakeLock = null;
  setWakeLockUI(false);
}

async function releaseWakeLock() {
  if (wakeLock) { await wakeLock.release(); }
}

function setWakeLockUI(active) {
  const pill  = document.getElementById('wakelockPill');
  const label = document.getElementById('wakelockLabel');
  pill.className  = 'wakelock-pill' + (active ? ' active' : '');
  label.textContent = active ? 'מסך פעיל' : 'מסך חופשי';
}

// Re-acquire wake lock when the page becomes visible (e.g. user wakes screen)
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  if (running && !wakeLock) await requestWakeLock();
  if (running) catchUpFromBackground();
});

/* ═══════════════════════════════════════════
   AUDIO — all beeps scheduled on the
   Web Audio clock so they fire even when
   JS timers are throttled (screen off)
═══════════════════════════════════════════ */
let audioCtx = null;
let scheduledNodes = [];

function getAudioCtx() {
  if (!audioCtx)
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function cancelScheduledAudio() {
  scheduledNodes.forEach(n => { try { n.stop(0); } catch(e){} });
  scheduledNodes = [];
}

function scheduleOsc(ctx, startAt, freq, durSec, vol) {
  if (startAt < ctx.currentTime) return; // already past
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, startAt);
  gain.gain.exponentialRampToValueAtTime(0.001, startAt + durSec);
  osc.start(startAt);
  osc.stop(startAt + durSec + 0.05);
  scheduledNodes.push(osc);
}

function schedulePhaseAudio() {
  cancelScheduledAudio();
  const ctx     = getAudioCtx();
  const secsLeft = Math.max(0, (phaseEndTime - Date.now()) / 1000);
  const now     = ctx.currentTime;

  // 3 sec before end – short beep
  if (secsLeft > 3) scheduleOsc(ctx, now + secsLeft - 3, 880, 0.13, 0.55);
  // 2 sec before end – short beep
  if (secsLeft > 2) scheduleOsc(ctx, now + secsLeft - 2, 880, 0.13, 0.55);
  // 1 sec before end – long beep
  if (secsLeft > 1) scheduleOsc(ctx, now + secsLeft - 1, 660, 0.60, 0.65);
  // At 0 – two long beeps (end of phase)
  scheduleOsc(ctx, now + secsLeft,       660, 0.50, 0.60);
  scheduleOsc(ctx, now + secsLeft + 0.7, 660, 0.50, 0.60);
}

/* ═══════════════════════════════════════════
   TIMER STATE
═══════════════════════════════════════════ */
let sequence      = [];
let seqIdx        = 0;
let phaseEndTime  = 0;   // absolute ms timestamp when current phase ends
let totalForPhase = 0;   // total seconds of current phase
let pausedSecs    = 0;   // seconds left when paused
let repeatCount   = 1;
let ticker        = null;
let running       = false;

const CIRC = 628.3; // 2π × 100

function buildSequence() {
  repeatCount = Math.max(1, parseInt(document.getElementById('repeatCount').value) || 1);
  sequence = [];
  for (let r = 0; r < repeatCount; r++) {
    roundDefs.forEach((rd, i) => {
      const secs = (rd.mins || 0) * 60 + (rd.secs || 0);
      if (secs > 0) {
        sequence.push({
          name: rd.name || `שלב ${i + 1}`,
          totalSecs: secs,
          isBreak: i % 2 === 1,
          repeatNum: r + 1,
        });
      }
    });
  }
}

/* ── Start ──────────────────────────────── */
function startTimer() {
  getAudioCtx(); // unlock audio on user gesture

  if (!running) {
    if (sequence.length === 0 || seqIdx >= sequence.length) {
      buildSequence();
      seqIdx = 0;
      loadPhase(seqIdx);
    } else if (pausedSecs > 0) {
      // Resume from pause – recalculate end time from stored remaining
      phaseEndTime = Date.now() + pausedSecs * 1000;
      pausedSecs   = 0;
      schedulePhaseAudio();
    } else {
      loadPhase(seqIdx);
    }

    running = true;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnPause').disabled = false;
    document.getElementById('btnReset').disabled = false;
    document.getElementById('finishedBanner').classList.remove('show');

    requestWakeLock();
    tick(); // immediate first render
    ticker = setInterval(tick, 500); // poll twice/sec for smooth display
  }
}

/* ── Pause ──────────────────────────────── */
function pauseTimer() {
  if (!running) return;
  clearInterval(ticker);
  running = false;
  pausedSecs = Math.max(0, Math.round((phaseEndTime - Date.now()) / 1000));
  cancelScheduledAudio();
  releaseWakeLock();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('statusText').textContent = '⏸ מושהה';
}

/* ── Reset ──────────────────────────────── */
function resetTimer() {
  clearInterval(ticker);
  running = false;
  cancelScheduledAudio();
  releaseWakeLock();
  seqIdx = 0; phaseEndTime = 0; pausedSecs = 0; sequence = [];

  document.getElementById('phaseBadge').textContent  = 'מוכן';
  document.getElementById('phaseBadge').className    = 'phase-badge';
  document.getElementById('roundInfo').textContent   = 'סיבוב – / –';
  document.getElementById('ringProgress').style.strokeDashoffset = '0';
  document.getElementById('ringProgress').style.stroke = 'var(--accent-work)';
  document.getElementById('timeDisplay').textContent = '00:00';
  document.getElementById('timeDisplay').className   = 'time-display';
  document.getElementById('statusText').textContent  = '';
  document.getElementById('btnStart').disabled  = false;
  document.getElementById('btnPause').disabled  = true;
  document.getElementById('btnReset').disabled  = true;
  document.getElementById('finishedBanner').classList.remove('show');
  renderPhasesBar([]);
}

/* ── Load phase ─────────────────────────── */
function loadPhase(idx) {
  const ph      = sequence[idx];
  totalForPhase = ph.totalSecs;
  phaseEndTime  = Date.now() + ph.totalSecs * 1000;
  pausedSecs    = 0;

  const badge = document.getElementById('phaseBadge');
  badge.textContent = ph.name;
  badge.className   = 'phase-badge' + (ph.isBreak ? ' break' : '');

  document.getElementById('ringProgress').style.stroke =
    ph.isBreak ? 'var(--accent-break)' : 'var(--accent-work)';

  document.getElementById('roundInfo').textContent =
    `סיבוב ${ph.repeatNum} / ${repeatCount}  •  שלב ${(idx % roundDefs.length) + 1} מתוך ${roundDefs.length}`;

  renderPhasesBar(sequence);
  schedulePhaseAudio(); // schedule all beeps on the audio clock
}

/* ── Tick (runs every 500ms) ────────────── */
function tick() {
  const secs = Math.max(0, Math.round((phaseEndTime - Date.now()) / 1000));
  updateDisplay(secs);

  if (secs <= 0 && running) {
    // Transition immediately – no waiting for next interval
    clearInterval(ticker);
    nextPhase();
  }
}

/* ── Next phase ─────────────────────────── */
function nextPhase() {
  seqIdx++;

  if (seqIdx >= sequence.length) {
    running = false;
    releaseWakeLock();
    cancelScheduledAudio();
    updateDisplay(0);
    document.getElementById('phaseBadge').textContent = 'הסתיים!';
    document.getElementById('statusText').textContent = '';
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnPause').disabled = true;
    document.getElementById('finishedBanner').classList.add('show');
    return;
  }

  loadPhase(seqIdx); // sets new phaseEndTime and schedules audio
  tick();            // immediate display of new phase
  if (running) ticker = setInterval(tick, 500);
}

/* ── Catch-up after screen-off ──────────── */
function catchUpFromBackground() {
  const now  = Date.now();
  // Fast-forward through any phases that ended while the screen was off
  while (running && phaseEndTime <= now) {
    if (seqIdx + 1 >= sequence.length) {
      // All done
      seqIdx = sequence.length;
      clearInterval(ticker);
      nextPhase(); // will trigger finish
      return;
    }
    seqIdx++;
    const ph  = sequence[seqIdx];
    totalForPhase = ph.totalSecs;
    // Each phase starts right after the previous ended
    phaseEndTime += ph.totalSecs * 1000;

    const badge = document.getElementById('phaseBadge');
    badge.textContent = ph.name;
    badge.className   = 'phase-badge' + (ph.isBreak ? ' break' : '');
    document.getElementById('ringProgress').style.stroke =
      ph.isBreak ? 'var(--accent-break)' : 'var(--accent-work)';
  }

  if (running) {
    schedulePhaseAudio(); // re-schedule remaining beeps
    tick();
    clearInterval(ticker);
    ticker = setInterval(tick, 500);
  }
}

/* ── Display ────────────────────────────── */
function updateDisplay(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  document.getElementById('timeDisplay').textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  document.getElementById('timeDisplay').className =
    secs <= 1 ? 'time-display danger'
  : secs <= 3 ? 'time-display warn'
  : 'time-display';

  document.getElementById('ringProgress').style.strokeDashoffset =
    CIRC * (1 - (totalForPhase > 0 ? secs / totalForPhase : 0));

  document.getElementById('statusText').textContent =
    (secs <= 3 && secs > 0 && running) ? `⚠️ ${secs} שניות נותרו!` : '';
}

function pulseRing() {
  const r = document.getElementById('ringWrap');
  r.classList.remove('beep');
  void r.offsetWidth;
  r.classList.add('beep');
}

function renderPhasesBar(seq) {
  const bar = document.getElementById('phasesBar');
  bar.innerHTML = '';
  seq.forEach((ph, i) => {
    const seg = document.createElement('div');
    seg.className = 'phase-seg'
      + (ph.isBreak ? ' break' : '')
      + (i < seqIdx   ? ' done'   : '')
      + (i === seqIdx ? ' active' : '');
    seg.title = ph.name;
    bar.appendChild(seg);
  });
}
</script>
